name: Processar PDFs CATT

on:
  schedule:
    # Dues vegades al dia (08:00 i 20:00 hora peninsular, UTC+2 d'estiu)
    - cron: '0 6 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch: # Permet executar manualment

concurrency:
  group: cat-results-process
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositori
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instal·lar dependències del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils curl

      - name: Instal·lar dependències Python
        run: |
          pip install --break-system-packages xlrd

      - name: Executar process_all.py
        run: |
          python3 process_all.py

      - name: Configurar git i fer commit/push
        if: success()
        run: |
          git config user.name "cat-results-bot"
          git config user.email "bot@cat-results.local"
          git add json/ track-catt.json
          git diff --cached --quiet || git commit -m "Processar PDFs CATT - $(date '+%Y-%m-%d %H:%M')"
          git push
